services:
  postgres:
    image: postgres:16
    container_name: dpr-site-control-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dpr
      POSTGRES_PASSWORD: dpr
      POSTGRES_DB: dpr_site_control
    ports:
      # Host port 5433 -> container 5432. Mapped off the default 5432 because
      # this dev machine already has an unrelated Postgres container bound to
      # 5432. Update DATABASE_URL to match if you change this back.
      - "5433:5432"
    volumes:
      - dpr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpr -d dpr_site_control"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dpr_pgdata:
